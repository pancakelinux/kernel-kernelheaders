name: Sync linux-cachyos from upstream
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # daily, 6am UTC — kernel updates happen often

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install base tools
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed curl rsync openssh pacman-contrib

      - name: Install cloudflared client
        run: |
          curl -L -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared

      - name: Set up SSH over Cloudflare Access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.REPO_SERVER_SSH_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          cat >> ~/.ssh/config << EOF
          Host panstore
            HostName ssh.pancakse.dev
            User ${{ secrets.REPO_SERVER_USER }}
            IdentityFile $HOME/.ssh/id_ed25519
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ACCESS_CLIENT_ID --service-token-secret $CF_ACCESS_CLIENT_SECRET
            StrictHostKeyChecking no
          EOF
          chmod 600 ~/.ssh/config

      - name: Add CachyOS repo
        run: |
          curl https://mirror.cachyos.org/cachyos-repo.tar.xz -o /tmp/cachyos-repo.tar.xz
          cd /tmp && tar xvf cachyos-repo.tar.xz
          cd cachyos-repo && ./cachyos-repo.sh --install
          pacman -Sy --noconfirm

      - name: Download linux-cachyos + headers (no install)
        run: |
          mkdir -p /tmp/dl
          pacman -Sw --noconfirm --cachedir /tmp/dl linux-cachyos linux-cachyos-headers
          ls -la /tmp/dl

      - name: Pull existing repo db
        run: |
          rsync -avz --ignore-missing-args -e "ssh -F $HOME/.ssh/config" \
            panstore:/srv/myrepo/x86_64/pancakelinuxrepo.db.tar.gz \
            panstore:/srv/myrepo/x86_64/pancakelinuxrepo.files.tar.gz \
            /tmp/dl/ || true

      - name: Add to repo database
        run: |
          cd /tmp/dl
          repo-add pancakelinuxrepo.db.tar.gz *.pkg.tar.zst

      - name: Deploy
        run: |
          rsync -avz --no-perms -e "ssh -F $HOME/.ssh/config" \
            /tmp/dl/*.pkg.tar.zst \
            /tmp/dl/pancakelinuxrepo.db.tar.gz \
            /tmp/dl/pancakelinuxrepo.db \
            /tmp/dl/pancakelinuxrepo.files.tar.gz \
            /tmp/dl/pancakelinuxrepo.files \
            panstore:/srv/myrepo/x86_64/
            
